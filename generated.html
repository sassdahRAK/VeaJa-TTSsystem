<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>please genereate a mini web-page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f8f9fa; color: #1a1a1a; line-height: 1.7; }
    header { background: #1a1a1a; color: #fff; padding: 2rem; text-align: center; }
    header h1 { font-size: 2rem; font-weight: 700; }
    header p  { opacity: .7; margin-top: .5rem; }
    main { max-width: 800px; margin: 3rem auto; padding: 0 1.5rem; }
    section { background: #fff; border-radius: 12px; padding: 2rem;
              margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    h2 { font-size: 1.3rem; margin-bottom: 1rem; }
    p  { color: #444; }
    .cta { display: inline-block; margin-top: 1.5rem; background: #1a1a1a;
           color: #fff; padding: .75rem 2rem; border-radius: 8px;
           text-decoration: none; font-weight: 600; }
    footer { text-align: center; padding: 2rem; color: #999; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>please genereate a mini web-page</h1>
    <p>Generated by Veaja</p>
  </header>
  <main>
    <section>
      <h2>About</h2>
      <p>please genereate a mini web-page</p>
      <a class="cta" href="#">Get Started</a>
    </section>
    <section>
      <h2>Features</h2>
      <p>• Feature one<br>• Feature two<br>• Feature three</p>
    </section>
    <section>
      <h2>Contact</h2>
      <p>your@email.com</p>
    </section>
  </main>
  <footer>© 2025 please genereate a mini web-page. All rights reserved.</footer>
</body>
</html>
